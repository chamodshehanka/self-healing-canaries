# Bootstrap / platform images. Run once before the demo (Actions -> release -> Run),
# or push a v* tag. Builds every image with the same tag (default v1.0.0).
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        default: v1.0.0
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - {name: payment,   context: apps,   app: payment}
        - {name: inventory, context: apps,   app: inventory}
        - {name: loadgen,   context: apps,   app: loadgen}
        - {name: ai-sre,    context: ai-sre, app: ""}
    steps:
    - uses: actions/checkout@v4
    - id: meta
      run: |
        echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
        echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.context }}
        build-args: APP=${{ matrix.app }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ghcr.io/${{ steps.meta.outputs.owner }}/scn-${{ matrix.name }}:${{ steps.meta.outputs.tag }}
        cache-from: type=gha,scope=${{ matrix.name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.name }}
