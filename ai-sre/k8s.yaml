# AI SRE in the staging (management) cluster.
#   ai-sre       FastAPI webhook + OpenAI Agents SDK agent + SQLite release ledger
#   mcp-grafana  Grafana MCP server sidecar, read-only (--disable-write), localhost only
# The prod cluster's Rollouts notifications reach this via NodePort 30808.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-sre
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sre
  namespace: ai-sre
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ai-sre}
  template:
    metadata:
      labels: {app: ai-sre}
    spec:
      containers:
      - name: ai-sre
        image: ${AI_SRE_IMAGE}
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef: {name: ai-sre-env}
        env:
        - {name: GRAFANA_MCP_URL, value: "http://localhost:8000/mcp"}
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
        volumeMounts:
        - {name: data, mountPath: /data}
      - name: mcp-grafana
        image: grafana/mcp-grafana:latest
        args: ["-t", "streamable-http", "--address", "localhost:8000",
               "--disable-write", "--disable-oncall", "--disable-incident", "--disable-alerting", "--disable-admin"]
        env:
        - {name: GRAFANA_URL, value: "http://grafana.observability:3000"}
        - {name: GRAFANA_USERNAME, value: admin}
        - {name: GRAFANA_PASSWORD, value: admin}
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-sre
  namespace: ai-sre
spec:
  type: NodePort
  selector: {app: ai-sre}
  ports:
  - {port: 8080, targetPort: 8080, nodePort: 30808}
