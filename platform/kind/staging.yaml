# Staging cluster. Also hosts the "management" pieces: Argo CD, Grafana, AI SRE.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: staging
nodes:
- role: control-plane
  extraPortMappings:
  - {containerPort: 30030, hostPort: 3000}    # Grafana (humans + Grafana MCP)
  - {containerPort: 30090, hostPort: 9090}    # Prometheus (staging)
  - {containerPort: 30686, hostPort: 16686}   # Jaeger (staging)
  - {containerPort: 30808, hostPort: 8088}    # AI SRE webhook + ledger UI
  - {containerPort: 30443, hostPort: 8443}    # Argo CD UI
