# OTel Collector: where identity gets attached — by the platform, not the app.
#
# k8sattributes looks up the sending pod (by connection IP) and stamps its
# rollouts-pod-template-hash label and ReplicaSet name onto every log and span.
# Loki stores these as structured metadata (not index labels), so they cost
# nothing in stream cardinality.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}

    processors:
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        pod_association:
        - sources: [{from: connection}]
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.replicaset.name, k8s.node.name]
          labels:
          - {tag_name: rollouts_pod_template_hash, key: rollouts-pod-template-hash, from: pod}
          - {tag_name: app, key: app, from: pod}
      resource:
        attributes:
        - {key: deployment.environment.name, value: "${DEPLOY_ENV}", action: upsert}
      batch: {timeout: 1s}

    exporters:
      otlp/jaeger:
        endpoint: jaeger.observability:4317
        tls: {insecure: true}
      otlphttp/loki:
        endpoint: http://loki.observability:3100/otlp

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes, resource, batch]
          exporters: [otlp/jaeger]
        logs:
          receivers: [otlp]
          processors: [k8sattributes, resource, batch]
          exporters: [otlphttp/loki]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
- apiGroups: [""]
  resources: [pods, namespaces, nodes]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [replicasets, deployments]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: otel-collector}
subjects:
- {kind: ServiceAccount, name: otel-collector, namespace: observability}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      serviceAccountName: otel-collector
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.135.0
        args: ["--config=/conf/config.yaml"]
        ports:
        - {name: otlp-grpc, containerPort: 4317}
        - {name: otlp-http, containerPort: 4318}
        volumeMounts:
        - {name: conf, mountPath: /conf}
        resources:
          limits: {cpu: 500m, memory: 512Mi}
      volumes:
      - name: conf
        configMap: {name: otel-collector}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector: {app: otel-collector}
  ports:
  - {name: otlp-grpc, port: 4317, targetPort: 4317}
  - {name: otlp-http, port: 4318, targetPort: 4318}
