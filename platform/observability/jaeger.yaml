# Jaeger v2 (all-in-one, in-memory). Runtime traces only — no CI spans.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/jaeger:2.10.0
        ports:
        - {name: otlp-grpc, containerPort: 4317}
        - {name: ui, containerPort: 16686}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  type: NodePort
  selector: {app: jaeger}
  ports:
  - {name: otlp-grpc, port: 4317, targetPort: 4317}
  - {name: ui, port: 16686, targetPort: 16686, nodePort: 30686}
