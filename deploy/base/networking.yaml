# Edge: Envoy Gateway (Gateway API). Argo Rollouts' gatewayAPI plugin moves the
# weights on this HTTPRoute — that is how setWeight: 1 means exactly 1% of users.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: checkout
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payment
spec:
  parentRefs:
  - name: checkout
  rules:
  - matches:
    - path: {type: PathPrefix, value: /pay}
    backendRefs:
    - name: payment-stable
      port: 8080
      weight: 100
    - name: payment-canary
      port: 8080
      weight: 0
---
apiVersion: v1
kind: Service
metadata:
  name: payment-stable
spec:
  selector: {app: payment}      # Rollouts adds rollouts-pod-template-hash=<stable>
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payment-canary
spec:
  selector: {app: payment}      # Rollouts adds rollouts-pod-template-hash=<canary>
  ports:
  - port: 8080
    targetPort: 8080
