apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
spec:
  replicas: 2
  selector:
    matchLabels: {app: inventory}
  template:
    metadata:
      labels: {app: inventory}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: inventory
        image: inventory
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: otel-collector.observability:4317
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 300m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
spec:
  selector: {app: inventory}
  ports:
  - port: 8080
    targetPort: 8080
